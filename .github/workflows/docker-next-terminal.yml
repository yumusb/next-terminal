name: Docker next-terminal Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  GHCR_next-terminal_Build:
    name: Docker next-terminal Build
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Private Actions Checkout
        uses: actions/checkout@v3
      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v2
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v2
      - name: Node Setup
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install dependencies and build
        run: |
          cd web
          npm install --global yarn
          yarn
          yarn build
      - name: Docker Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker images
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/next-terminal:latest
            ghcr.io/${{ github.actor }}/next-terminal:${{ env.VERSION }}
          cache-from: type=registry,ref=ghcr.io/${{ github.actor }}/next-terminal:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.actor }}/next-terminal:cache,mode=max

  GHCR_Hub_Description:
    needs: [ GHCR_next-terminal_Build ]
    name: Change GHCR Description
    runs-on: ubuntu-latest
    steps:
      - name: Private Actions Checkout
        uses: actions/checkout@v3
      - name: Update GHCR Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          repository: ghcr.io/${{ github.actor }}/next-terminal
